<!doctype html>
<!-- teacher.html — THE TEACHER'S PAGE. All of it is filled in by js/teacher.js. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doorbell · Teacher</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Top bar: name, class picker, sign out -->
  <header class="topbar">
    <strong class="brand">🔔 Doorbell</strong>
    <label class="inline">Class
      <select id="class-select"></select>
    </label>
    <span class="spacer"></span>
    <span id="who" class="muted"></span>
    <button class="btn" id="sign-out">Sign out</button>
  </header>

  <main class="page">
    <h1 id="title">Today</h1>
    <p id="subtitle" class="muted"></p>

    <!-- Shown when the teacher has no class yet -->
    <div id="no-class" class="card" hidden>
      <h2>No class assigned yet</h2>
      <p class="muted">Ask the school admin to assign you to a section.</p>
    </div>

    <div id="content">
      <!-- Past days whose attendance was never confirmed -->
      <div id="unconfirmed" class="card warn" hidden></div>

      <!-- Children absent or late several days in a row. Shown first because it matters most. -->
      <section class="card">
        <h2>Attention needed</h2>
        <ul id="attention" class="list"></ul>
      </section>

      <!-- Today's attendance: scan box, counts and the class list -->
      <section class="card">
        <div class="row">
          <h2>Attendance</h2>
          <span class="spacer"></span>
          <button class="btn primary" id="confirm">Confirm attendance</button>
        </div>
        <!-- A USB barcode scanner works like a keyboard: it types the code and presses Enter. -->
        <form id="scan-form" class="scan">
          <input id="scan-input" placeholder="Scan a card (or type the code) and press Enter" autocomplete="off" />
          <button class="btn" type="submit">Record</button>
        </form>
        <p id="scan-result" class="scan-result"></p>
        <div id="counts" class="counts"></div>
        <table class="table">
          <thead><tr><th>Learner</th><th>Arrived</th><th>Status</th><th>Change</th></tr></thead>
          <tbody id="roster"></tbody>
        </table>
      </section>

      <div class="grid-2">
        <!-- Alerts: 3-day streaks for my classes and calendar changes from the admin -->
        <section class="card">
          <h2>Alerts</h2>
          <ul id="alerts" class="list"></ul>
        </section>
        <!-- Text messages sent to parents today (simulated) -->
        <section class="card">
          <h2>Texts to parents today</h2>
          <ul id="sms" class="list"></ul>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="js/teacher.js"></script>
</body>
</html>
